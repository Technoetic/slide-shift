<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11130f">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="순서는 바꿔라. 결과는 지켜라. 관련된 명령 카드를 모으는 90초 액션 퍼즐, SLIDE / SHIFT.">
  <meta name="app-build" content="ss-7d78cc817c24">
  <meta name="app-base" content="./">
  <title>SLIDE / SHIFT — 순서는 바꿔라. 결과는 지켜라.</title>
  <link rel="stylesheet" href="./assets/app.ss-7d78cc817c24.css">
  <script type="module" src="./assets/main.ss-7d78cc817c24.js"></script>
</head>
<body>
  <div id="app" tabindex="-1"></div>
  <noscript><p class="no-script">SLIDE / SHIFT를 플레이하려면 브라우저의 JavaScript를 켜 주세요.</p></noscript>

  <template id="header-template">
    <header class="site-header">
      <a class="brand" href="#/" data-route="/" aria-label="SLIDE SHIFT 홈">
        <span class="brand-symbol" aria-hidden="true">↕</span>
        <span class="brand-word">SLIDE <span aria-hidden="true">/</span> SHIFT</span>
      </a>
      <nav class="site-nav" aria-label="주 메뉴">
        <a href="#/" data-route="/">플레이</a>
        <a href="#/guide" data-route="/guide">플레이 가이드</a>
        <a href="#/records" data-route="/records">내 기록</a>
      </nav>
      <button class="button button-ghost sound-toggle" type="button" data-action="sound" aria-pressed="false" aria-label="소리 켜기">
        <span class="sound-icon" aria-hidden="true">♪</span>
        <span class="sound-label">소리 끔</span>
      </button>
    </header>
  </template>

  <template id="home-template">
    <main class="home-screen" id="main-content" tabindex="-1">
      <section class="home-hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <p class="kicker hero-kicker"><span class="status-dot" aria-hidden="true"></span>순서 감각을 깨우는 액션 퍼즐</p>
          <h1 class="hero-title" id="hero-title" aria-label="SLIDE SHIFT">
            <span>SLIDE</span>
            <span class="hero-title-shift"><span class="hero-slash" aria-hidden="true">/</span>SHIFT</span>
          </h1>
          <p class="hero-line">순서는 바꿔라.<br><span>결과는 지켜라.</span></p>
          <p class="hero-description">흩어진 명령 카드를 움직여 같은 일끼리 모아 보세요.<br class="desktop-break">결과를 바꾸지 않는 한 수. 이제 당신 차례입니다.</p>
          <div class="hero-actions">
            <a class="button button-primary hero-start" href="#/play?mode=rush" data-route="/play?mode=rush">90초 도전 <span aria-hidden="true">↗</span></a>
            <a class="button button-secondary" href="#/play?mode=practice" data-route="/play?mode=practice">천천히 연습 <span aria-hidden="true">→</span></a>
          </div>
          <dl class="hero-facts">
            <div><dt>제한 시간</dt><dd>90<span>초</span></dd></div>
            <div><dt>이어지는 도전</dt><dd>8<span>단계</span></dd></div>
            <div><dt>플레이 방식</dt><dd class="hero-facts-input">드래그<span>· 키보드 · 터치</span></dd></div>
          </dl>
        </div>

        <div class="hero-demo" aria-label="명령 카드를 모으는 게임판 미리보기">
          <div class="demo-topline"><span>STAGE PREVIEW</span><span>01 <span class="muted">/ 08</span></span></div>
          <div class="demo-heading"><h2>같은 일끼리,<br>가까이.</h2><span class="demo-badge">화물 카드 모으기</span></div>
          <ol class="board demo-board" aria-label="정적 게임판 예시">
            <li class="statement" data-group="cargo">
              <span class="statement-handle" aria-hidden="true">⠿</span>
              <span class="statement-number">01</span>
              <div class="statement-body"><span class="statement-label">화물을 준비한다</span><code class="statement-code">cargo = 3</code></div>
              <span class="statement-group">화물</span>
            </li>
            <li class="statement" data-group="signal">
              <span class="statement-handle" aria-hidden="true">⠿</span>
              <span class="statement-number">02</span>
              <div class="statement-body"><span class="statement-label">신호등을 켠다</span><code class="statement-code">signal = "ON"</code></div>
              <span class="statement-group">신호</span>
            </li>
            <li class="statement is-selected" data-group="cargo">
              <span class="statement-handle" aria-hidden="true">⠿</span>
              <span class="statement-number">03</span>
              <div class="statement-body"><span class="statement-label">화물을 더한다</span><code class="statement-code">cargo = cargo + 2</code></div>
              <span class="statement-group">화물</span>
            </li>
          </ol>
          <div class="demo-move"><span class="demo-move-arrow" aria-hidden="true">↑</span><p>세 번째 카드를 위로.<br><strong>순서가 달라도 결과는 그대로.</strong></p><span class="demo-move-step" aria-hidden="true">03 → 02</span></div>
          <div class="output-panel demo-output">
            <div class="output-heading"><span>결과 비교</span><span class="output-status">일치</span></div>
            <div class="output-row"><span>이동 전</span><code>화물 5 · 신호 ON</code></div>
            <div class="output-row"><span>이동 후</span><code>화물 5 · 신호 ON</code></div>
          </div>
          <p class="demo-footnote"><span aria-hidden="true">↕</span>플레이 미리보기 · 도전에서 직접 움직여 보세요</p>
        </div>
      </section>

      <section class="home-rule-strip" aria-label="세 가지 플레이 규칙">
        <div><span class="rule-index" aria-hidden="true">01</span><p><strong>같은 일은 모으고</strong><span>목표 카드를 나란히 붙이세요.</span></p></div>
        <div><span class="rule-index" aria-hidden="true">02</span><p><strong>결과는 지키고</strong><span>위험한 이동은 막히고 3초 차감.</span></p></div>
        <div><span class="rule-index" aria-hidden="true">03</span><p><strong>다음 단계로</strong><span>막히면 힌트. 시간은 5초 차감.</span></p></div>
      </section>
      <footer class="home-footer">
        <p>마틴 파울러의 ‘문장 이동하기’에서 착안한 작은 도전.</p>
        <a class="text-link" href="#/guide" data-route="/guide">처음이라면 플레이 가이드 <span aria-hidden="true">↗</span></a>
      </footer>
    </main>
  </template>
</body>
</html>
